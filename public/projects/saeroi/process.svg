<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">새로이 브랜드 업무 흐름</title>
  <desc id="desc">소재 거래, 가공, 생산, 제품 판매를 AI 여정 어시스턴트가 연결하며 변경 작업은 사용자 승인 후 처리한다.</desc>
  <rect width="1200" height="750" fill="#f4f8f6"/>
  <rect x="56" y="56" width="1088" height="638" rx="28" fill="#fff" stroke="#cbded5" stroke-width="2"/>
  <text x="100" y="132" fill="#163b30" font-size="28" font-weight="700" font-family="sans-serif">SAEROI · 브랜드의 제품 제작 여정</text>
  <text x="100" y="171" fill="#476459" font-size="18" font-family="sans-serif">기존 업무 API를 대화에 연결하고, 실제 실행은 서버 상태와 사용자 승인을 거칩니다.</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="96" y="252" width="216" height="150" rx="19" fill="#e2f3e9" stroke="#80b79a" stroke-width="2"/>
    <text x="204" y="312" fill="#163b30" font-size="25" font-weight="700">01 소재 거래</text>
    <text x="204" y="351" fill="#476459" font-size="17">조회 · 구매 · 수령</text>
    <rect x="360" y="252" width="216" height="150" rx="19" fill="#e5f0ed" stroke="#90b7ad" stroke-width="2"/>
    <text x="468" y="312" fill="#163b30" font-size="25" font-weight="700">02 가공</text>
    <text x="468" y="351" fill="#476459" font-size="17">업체 · 작업 · 결과</text>
    <rect x="624" y="252" width="216" height="150" rx="19" fill="#e5f0ed" stroke="#90b7ad" stroke-width="2"/>
    <text x="732" y="312" fill="#163b30" font-size="25" font-weight="700">03 생산</text>
    <text x="732" y="351" fill="#476459" font-size="17">배치 · 투입 · 기록</text>
    <rect x="888" y="252" width="216" height="150" rx="19" fill="#e2f3e9" stroke="#80b79a" stroke-width="2"/>
    <text x="996" y="312" fill="#163b30" font-size="25" font-weight="700">04 제품 판매</text>
    <text x="996" y="351" fill="#476459" font-size="17">등록 · 판매 시작</text>
    <text x="336" y="337" fill="#5f8a74" font-size="30">→</text>
    <text x="600" y="337" fill="#5f8a74" font-size="30">→</text>
    <text x="864" y="337" fill="#5f8a74" font-size="30">→</text>
    <rect x="96" y="476" width="1008" height="145" rx="20" fill="#163b30"/>
    <text x="600" y="529" fill="#fff" font-size="26" font-weight="700">AI 여정 어시스턴트 · 31개 업무 도구</text>
    <text x="600" y="570" fill="#c8ead7" font-size="19">실제 상태 조회 → 변경 작업 확인 카드 → 사용자 승인 → 최신 상태 재검증</text>
  </g>
</svg>
